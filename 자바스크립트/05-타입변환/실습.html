<!DOCTYPE html>
<html lang="ko-KR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웹에서의 타입 변환 필요성</title>
</head>
<body>

  <table>
    <caption>표 제목</caption>
    <tr>
      <th scope="col">셀 제목</th>
      <th scope="col">셀 제목</th>
    </tr>
    <tbody>
      <tr>
        <td>셀 내용</td>
        <td>셀 내용</td>
      </tr>
    </tbody>
  </table>

  <ul>
    <li>하나</li>
    <li>둘</li>
    <li>셋</li>
  </ul>
  <form>
    <label for="age">나이</label>
    <input type="number" name="age" id="age" min="0" value="19" max="150" />
    <button type="submit" disabled>계산</button>
  </form>

</body>
</html>
